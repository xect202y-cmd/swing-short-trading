[project]
name = "swing-short-trading"
version = "0.1.0"
description = "AI 보조 단기 스윙 트레이딩 자동화 (페이퍼 트레이딩 기본). Hermes와 분리된 독립 테스트 프로그램."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Leeyongsoo" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
# 실데이터 소스(없어도 합성 데이터로 동작). 실전/확장용.
market = ["pykrx>=1.0.45", "yfinance>=0.2.40"]
http = ["httpx>=0.27", "websockets>=12.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
swing-trader = "swing_trader.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swing_trader"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # 라인길이는 line-length로 관리

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
